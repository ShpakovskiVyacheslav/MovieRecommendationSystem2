<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/auth.css">
    <title>Сброс пароля</title>
    <style>
        .password-requirements {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        .password-requirements ul {
            margin: 8px 0 0 20px;
            padding: 0;
        }
        .password-requirements li {
            margin-bottom: 4px;
        }
        .password-requirements .valid {
            color: #28a745;
        }
        .password-requirements .invalid {
            color: #dc3545;
        }
        .password-match {
            font-size: 12px;
            margin-top: 5px;
        }
        .password-match.valid {
            color: #28a745;
        }
        .password-match.invalid {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <form class="login_form" method="post" action="/reset_confirm" id="resetForm">
            <h2 class="form-title">Сброс пароля</h2>

            <div id="errorMessage" class="alert alert-error" style="display: none;"></div>

            <input type="hidden" name="email" value="{{ email }}">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" class="form-control" value="{{ email }}" disabled style="background-color: #e9ecef;">
            </div>

            <div class="mb-3">
                <label for="code" class="form-label">Код подтверждения</label>
                <input type="text" class="form-control" id="code" name="code" placeholder="Введите код из письма" required>
            </div>

            <div class="mb-3">
                <label for="new_password" class="form-label">Новый пароль</label>
                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Введите новый пароль" required>
                <div class="password-requirements">
                    <strong>Требования к паролю:</strong>
                    <ul>
                        <li id="length">✓ Минимум 8 символов</li>
                        <li id="uppercase">✓ Хотя бы одна заглавная буква (A-Z)</li>
                        <li id="lowercase">✓ Хотя бы одна строчная буква (a-z)</li>
                        <li id="number">✓ Хотя бы одна цифра (0-9)</li>
                    </ul>
                </div>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Повторите пароль</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Повторите пароль" required>
                <div id="match-message" class="password-match"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="submitBtn">Сменить пароль</button>

            <div class="switch-link">
                <a href="/">Вернуться ко входу</a>
            </div>
        </form>
    </div>

    <script>
        const newPassword = document.getElementById('new_password');
        const confirmPassword = document.getElementById('confirm_password');
        const submitBtn = document.getElementById('submitBtn');

        const lengthReq = document.getElementById('length');
        const uppercaseReq = document.getElementById('uppercase');
        const lowercaseReq = document.getElementById('lowercase');
        const numberReq = document.getElementById('number');
        const matchMessage = document.getElementById('match-message');

        function validatePassword() {
            const password = newPassword.value;

            let isValid = true;

            if (password.length >= 8) {
                lengthReq.classList.add('valid');
                lengthReq.classList.remove('invalid');
            } else {
                lengthReq.classList.add('invalid');
                lengthReq.classList.remove('valid');
                isValid = false;
            }

            if (/[A-Z]/.test(password)) {
                uppercaseReq.classList.add('valid');
                uppercaseReq.classList.remove('invalid');
            } else {
                uppercaseReq.classList.add('invalid');
                uppercaseReq.classList.remove('valid');
                isValid = false;
            }

            if (/[a-z]/.test(password)) {
                lowercaseReq.classList.add('valid');
                lowercaseReq.classList.remove('invalid');
            } else {
                lowercaseReq.classList.add('invalid');
                lowercaseReq.classList.remove('valid');
                isValid = false;
            }

            if (/[0-9]/.test(password)) {
                numberReq.classList.add('valid');
                numberReq.classList.remove('invalid');
            } else {
                numberReq.classList.add('invalid');
                numberReq.classList.remove('valid');
                isValid = false;
            }

            return isValid;
        }

        function validateMatch() {
            const password = newPassword.value;
            const confirm = confirmPassword.value;

            if (confirm === '') {
                matchMessage.textContent = '';
                return false;
            }

            if (password === confirm) {
                matchMessage.textContent = '✓ Пароли совпадают';
                matchMessage.classList.add('valid');
                matchMessage.classList.remove('invalid');
                return true;
            } else {
                matchMessage.textContent = '✗ Пароли не совпадают';
                matchMessage.classList.add('invalid');
                matchMessage.classList.remove('valid');
                return false;
            }
        }

        function checkForm() {
            const isPasswordValid = validatePassword();
            const isMatchValid = validateMatch();

            submitBtn.disabled = !(isPasswordValid && isMatchValid);
        }

        newPassword.addEventListener('input', () => {
            validatePassword();
            validateMatch();
            checkForm();
        });

        confirmPassword.addEventListener('input', () => {
            validateMatch();
            checkForm();
        });
    </script>
</body>
</html>
